      "6": Auto-translate for Loom
      "7": Record once. Everyone watches in their own language, with captions and an AI voice-over.
      "8": Loom product marketing  ·  Concept launch  ·  November 2026

  - slide: 2
    boxes:
      "3": AGENDA
      "4": What we'll cover today
      "6": Why one update turns into three
      "8": Meet auto-translate
      "10": How it works
      "12": What the beta showed
      "14": Plans and next steps
      "15": null
      "16": null

