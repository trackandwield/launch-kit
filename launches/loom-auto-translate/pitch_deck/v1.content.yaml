    boxes:
      "3": THE PROBLEM
      "4": Global teams record the same update twice
      "6": 3x
      "7": The takes a lead records of one update for a team in three languages.
      "8":
        - Leads re-record every update for each language on the team
        - Or they send one version, and some people only get half of it
        - Loom already transcribes in 50+ languages, but viewers still read in the original
        - Time spent on extra takes is time not spent on the work

  - slide: 4
    boxes:
      "3": THE SOLUTION
      "4": One recording, every language on your team
      "7": Record once
      "8": Share one Loom with the whole team. No second take for each region.
      "11": Pick a language
      "12": Viewers choose from 10 languages in the player and get captions plus an AI voice-over.
      "15": Nothing to redo
      "16": Your original video stays exactly as you recorded it. Translation is added for the viewer.

