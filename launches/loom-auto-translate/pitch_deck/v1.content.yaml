# Pitch deck content for the Loom auto-translate launch, version 1.
# Written to companies/atlassian/deck/template-map.yaml: each key is a box on that template
# slide, and each value fits its max_chars. A list is one paragraph per item; null deletes the box.
# Facts come from the brief (hypothetical launch) and the framework's public facts table.
template: companies/atlassian/deck/sample-template.pptx
brief: companies/atlassian/products/loom/briefs/01-auto-translate.yaml

chrome:
  Logo word: Loom
  Footer: Unofficial concept made for a portfolio. Not an Atlassian announcement, and not affiliated with Atlassian.
  Slide number: "{n}"

# Words from the template's sample content that must not survive.
leftover_words: [Pipeline Pulse, Sample Co, pipeline, samplecompany, Northwind]

